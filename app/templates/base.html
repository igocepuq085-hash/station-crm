<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}station-crm{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg border-bottom bg-white sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-semibold" href="/">station-crm</a>
      <div class="d-flex gap-2">
        {% if request.session.get("admin_user") %}
          <a class="btn btn-sm btn-outline-secondary" href="/">Главная</a>
          <a class="btn btn-sm btn-outline-secondary" href="/trends">Тренды</a>
          <a class="btn btn-sm btn-primary" href="/upload">Загрузить отчеты</a>
          <a class="btn btn-sm btn-outline-danger" href="/logout">Выйти</a>
        {% else %}
          <a class="btn btn-sm btn-primary" href="/login">Войти</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="page-shell">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
